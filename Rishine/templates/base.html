<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}RiShine{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'DM Sans', sans-serif;
            background-color: #efede3;
            color: #302f2c;
            min-height: 100vh;
            margin: 0;
        }

        .contenido {
            padding: 32px;
            max-width: 1200px;
            margin: 0 auto;
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>
    {% include "navbar.html" %}
    <main class="contenido">
        {% block contenido %}{% endblock %}
    </main>
    {% block extra_js %} {% endblock %}

    <script>
        function mostrarToast() {
            const toast = document.getElementById('toast');
            toast.style.opacity = '1';
            setTimeout(() => {
                toast.style.opacity = '0';
            }, 3000);
        }
    </script>

    <!-- Toast -->
    <div id="toast" style="
        position: fixed;
        bottom: 30px;
        left: 50%;
        transform: translateX(-50%);
        background: #381932;
        color: white;
        padding: 12px 24px;
        border-radius: 20px;
        font-size: 14px;
        opacity: 0;
        transition: opacity 0.4s;
        z-index: 9999;
        pointer-events: none;
    ">Esta función estará próximamente</div>
</body>
</html>
