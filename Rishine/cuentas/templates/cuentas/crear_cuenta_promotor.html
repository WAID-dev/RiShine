<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Crear cuenta promotor</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: #efede3;
            font-family: sans-serif;
        }

        .contenedor {
            max-width: 440px;
            width: 100%;
            padding: 30px;
            border-radius: 20px;
            background: rgba(110, 7, 255, 0.428);
        }

        .campo {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
        }

        .campo label {
            width: 140px;
        }
    </style>
</head>
<body>
    <div class="contenedor">
        <h1>Crear cuenta promotor</h1>
        <form method="post" action="{% url 'cuentas:promotor' %}">
            {% csrf_token %}
            <input type="hidden" name="next" value="{{ request.GET.next|default:'/' }}">
            <div class="campo">
                <label for="organizacion">Organizacion</label>
                <input type="text" id="organizacion" name="organizacion" required>
            </div>
            <div class="campo">
                <label for="telefono">Telefono</label>
                <input type="text" id="telefono" name="telefono" maxlength="12" required>
            </div>
            <button type="submit">CREAR CUENTA PROMOTOR</button>
        </form>
    </div>
</body>
</html>
