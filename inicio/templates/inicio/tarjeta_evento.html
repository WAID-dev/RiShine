<!-- plantilla de las tagetas de los eventos -->
<a href="{% url 'ver_evento:ver_evento' %}" class="evento-card">
    <div class="evento-imagen">
        {% if evento.imagen %}
            <img src="{{ evento.imagen.url }}" alt="{{ evento.titulo }}">
        {% else %}
            <!-- Imagen de un calendario minimalista -->
            <svg viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="4" width="18" height="18" rx="2"/>
                <line x1="16" y1="2" x2="16" y2="6"/>
                <line x1="8" y1="2" x2="8" y2="6"/>
                <line x1="3" y1="10" x2="21" y2="10"/>
            </svg>
        {% endif %}
        <span class="evento-tipo">Evento</span>
    </div>
    <div class="evento-info">
        <div class="evento-nombre text-base">{{ evento.titulo }}</div>
        <div class="evento-ubicacion text-sm">{{ evento.direccion }}</div>
        <div class="evento-precio text-sm">$ {{ evento.costo }}</div>
    </div>
</a>
